# Zeabur-served front-end: the Zeabur gateway terminates TLS and forwards HTTP
# to this container on port 80, so there is no local TLS and no 80->443
# redirect. The three SPAs are static files; /api and /media are reverse
# proxied to the Edge API service on Zeabur's internal network.
upstream edge_api {
    server service-6a8c7a76b1c569569969f212:8080;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 8m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---- API + uploaded product imagery -------------------------------------
    location /api/ {
        proxy_pass http://edge_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Zeabur terminates TLS before this container, so advertise HTTPS to the API.
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location /media/ {
        proxy_pass http://edge_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # ---- Hashed build assets can be cached indefinitely ---------------------
    location ~* ^/(kds|admin)?/?assets/.*\.(js|css|woff2?|png|jpg|jpeg|svg|webp)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # ---- The three single-page apps ----------------------------------------
    location ~* /index\.html$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
    }

    location = /kds {
        return 301 /kds/;
    }

    location = /admin {
        return 301 /admin/;
    }

    location /kds/ {
        try_files $uri $uri/ /kds/index.html;
    }

    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
