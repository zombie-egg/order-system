# Single-host production stack: one Nginx container serving all three web apps
# and proxying the Edge API, plus the API and PostgreSQL.
#
#   docker compose -f deploy/compose.prod.yaml --env-file deploy/.env.production up -d --build
name: sippilot

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published on the host: only the API needs to reach it.

  api:
    build:
      context: ../apps/edge-api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 8080
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?connect_timeout=10
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (min 32 bytes)}
      JWT_ISSUER: ${JWT_ISSUER:-smart-drink-edge}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-smart-drink-operations}
      MOCK_PAYMENT_ENABLED: 'false'
      MEDIA_STORAGE_DIR: /app/var/media
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: json
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Europe/Amsterdam}
      DEFAULT_COUNTRY: ${DEFAULT_COUNTRY:-NL}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-EUR}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-nl-NL}
      # Front-ends are same-origin behind Nginx, so no cross-origin allowance
      # is needed.
      CORS_ORIGINS: '[]'
      # Settings would otherwise try to read a .env file that is not in the image.
      SMART_DRINK_ENV_FILE: /dev/null
    # Schema migrations run before the server accepts traffic.
    command:
      - sh
      - -c
      - |
        set -e
        python -m alembic upgrade head
        exec python -m uvicorn app.main:app \
          --host 0.0.0.0 --port 8080 --no-access-log \
          --proxy-headers --forwarded-allow-ips='*'
    volumes:
      - media-data:/app/var/media
    depends_on:
      postgres:
        condition: service_healthy
    # Not published on the host: Nginx is the only entry point.

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      # Self-signed certificate generated on the host by deploy/make-cert.sh.
      # Replace with a CA-issued pair, or front the stack with Caddy, once a
      # domain is available.
      - ./tls:/etc/nginx/tls:ro
    depends_on:
      - api

volumes:
  postgres-data:
  media-data:
